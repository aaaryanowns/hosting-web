<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARFAT HOST | Login</title>
<style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,390px);background:#121216;border:1px solid #29292e;border-radius:20px;padding:26px;box-sizing:border-box}h1{margin:0 0 8px}.muted{color:#999;font-size:14px;margin-bottom:22px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #333;background:#0b0b0d;color:#fff}button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:11px;background:#007aff;color:#fff;font-weight:700}a{color:#62a8ff;text-decoration:none}.err{color:#ff6259;margin-top:12px;font-size:14px}</style></head>
<body><div class="card"><h1>⚡ ARFAT HOST</h1><div class="muted">Sign in to your hosting dashboard</div>
<form id="form"><input name="email" placeholder="Email or username" required><input name="password" type="password" placeholder="Password" required><button>LOGIN</button><div id="err" class="err"></div></form>
<p class="muted">Don't have an account? <a href="/signup">Create one</a></p></div>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/login',{method:'POST',body:new FormData(e.target)});const d=await r.json().catch(()=>({}));if(d.status==='success')location.href=d.url;else document.getElementById('err').textContent=d.msg||'Login failed';}</script></body></html>
